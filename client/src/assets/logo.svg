<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" role="img" aria-labelledby="title desc">
  <title id="title">SmartBoard logo</title>
  <desc id="desc">Original SmartBoard four-tile logo with a transparent exterior.</desc>
  <defs>
    <clipPath id="logoCrop">
      <rect x="5" y="4" width="40" height="40" rx="9"/>
    </clipPath>
  </defs>
  <image width="48" height="48" href="data:image/png;base64," clip-path="url(#logoCrop)" preserveAspectRatio="xMidYMid meet"/>
</svg>
